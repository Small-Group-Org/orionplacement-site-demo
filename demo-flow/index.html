<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Find candidates demo | Orion Placement</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F5; --paper-2:#F2F0E9; --card:#FFFFFF;
  --ink:#1A1917; --ink-2:#4E5F55; --ink-3:#546359; --line:#E4E2DA; --line-2:#D8D5CC;
  --green:#2F62B8; --green-2:#27529C; --green-soft:#EEF3F9; --navy:#1B3A6B;
  --brass:#2D5CA6; --brass-soft:#EEF3F9; --red:#B3261E;
  --r:10px;
  --serif:"DM Serif Display",Georgia,serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.005em;line-height:1.15}
h1{font-size:clamp(1.8rem,4.2vw,2.7rem)}
h2{font-size:clamp(1.3rem,2.6vw,1.7rem)}
h3{font-size:1.1rem}
a{color:var(--green)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-3)} .small{font-size:.86rem}
.eyebrow{display:block;font:500 .74rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}

/* demo bar */
.demobar{background:var(--ink);color:#f3efe6;font-size:.84rem;position:relative;z-index:70}
.demobar .wrap{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.demobar b{font-weight:600}
.seg{display:inline-flex;border:1px solid #57534b;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#d9d3c6;padding:6px 10px;cursor:pointer;min-height:34px}
.seg button[aria-pressed=true]{background:#f3efe6;color:var(--ink);font-weight:600}
.demobar .restart{background:transparent;border:1px solid #57534b;color:#f3efe6;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:34px}
.demobar .note{color:#b9b2a3;flex:1 1 220px}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:60px;gap:12px}
.logo{display:inline-flex;align-items:center;text-decoration:none}
.logo img{height:38px;width:auto;display:block}
.sender{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}

/* stepper */
.steps{display:flex;gap:6px;list-style:none;padding:14px 0 0;overflow-x:auto;scrollbar-width:none}
.steps li{flex:1 1 0;min-width:0;font-size:.72rem;color:var(--ink-3);border-top:3px solid var(--line);padding-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepcap{display:none;font-size:.78rem;color:var(--ink-2);padding:6px 0 10px}
@media(max-width:600px){.steps li{font-size:0;padding-top:0}.stepcap{display:block}}
.steps li.on{color:var(--ink);border-color:var(--green);font-weight:600}
.steps li.done{color:var(--green-2);border-color:var(--green-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:9px;font-weight:600;font-size:.98rem;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:background .15s,border-color .15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}
.btn-quiet{background:transparent;border:0;color:var(--green);padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.btn-block{width:100%}
.trust{font-size:.82rem;color:var(--ink-3);margin-top:8px}
.trust b{color:var(--ink);font-weight:600}
.stars{color:var(--navy);letter-spacing:1px}

section.screen{padding:28px 0 64px}
.hero{max-width:720px;margin:0 auto;text-align:center;padding-top:28px}
.hero p.lede{color:var(--ink-2);font-size:1.06rem;margin:10px auto 0;max-width:56ch}

/* the box */
.askbox{margin:24px auto 0;max-width:720px;background:var(--card);border:1.5px solid var(--line-2);border-radius:16px;padding:12px 12px 12px 16px;box-shadow:0 6px 24px rgba(28,27,25,.06);text-align:left;transition:border-color .15s}
.askbox:focus-within{border-color:var(--green)}
.askbox textarea{width:100%;border:0;background:transparent;resize:none;font:inherit;font-size:1.05rem;line-height:1.45;min-height:56px;outline:none;color:var(--ink)}
.askbox .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.askbox .hint{font-size:.8rem;color:var(--ink-3)}
.send{width:46px;height:46px;border-radius:12px;background:var(--green);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--line-2);cursor:not-allowed}
.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.86rem;cursor:pointer;color:var(--ink-2);min-height:36px}
.chip:hover{border-color:var(--green);color:var(--green)}

/* reading */
.reading{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--ink-2);margin-top:18px;font-size:.92rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1s infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* understood tags */
.understood{margin:22px auto 0;max-width:1040px}
.understood .label{font-size:.82rem;color:var(--ink-3);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:1px solid #D9E3EF;border-radius:999px;padding:0 4px 0 12px;font-size:.88rem;min-height:38px}
.tag .k{color:var(--ink-3);font-size:.76rem}
.tag select,.tag input{border:0;background:transparent;font:inherit;font-weight:600;color:var(--green);padding:6px 4px;cursor:pointer;max-width:200px}
.tag input{width:72px;cursor:text}
.tag.empty{background:var(--card);border-style:dashed;border-color:var(--line-2)}
.tag.empty select{color:var(--ink-3);font-weight:500}
.tag .src{font-size:.7rem;color:var(--brass);font-weight:600;padding-right:8px}

/* one question */
.question{margin:18px 0 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:14px 16px}
.question p{font-weight:600;margin-bottom:10px}
.question .chips{display:flex;flex-wrap:wrap;gap:8px}

/* results */
.results-head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin:26px 0 14px}
.results-head p{color:var(--ink-2);font-size:.92rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card .id{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between}
.card h3{font-size:1.05rem}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:.85rem}
.facts dt{color:var(--ink-3);font-size:.74rem}
.facts dd{font-weight:500}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.mix span:nth-child(1){background:var(--navy)} .mix span:nth-child(2){background:var(--green);opacity:.75} .mix span:nth-child(3){background:#8FB4F2}
.mixlegend{font-size:.74rem;color:var(--ink-3)}
.why{font-size:.88rem;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:10px}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{font-size:.72rem;background:var(--brass-soft);color:#244B87;border-radius:6px;padding:3px 7px;font-weight:500}
.stamp::before{content:"\2713  "}
.fit{font-size:.74rem;font-weight:600;color:var(--green-2)}
.fit.warn{color:var(--red)}
.card .btn{margin-top:auto}
.nomatch{background:var(--card);border:1px dashed var(--line-2);border-radius:var(--r);padding:20px}
.nomatch h3{margin-bottom:6px}
.nomatch form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* side info */
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:36px}
.how div{border-top:2px solid var(--line-2);padding-top:10px;font-size:.86rem;color:var(--ink-2)}
.how b{display:block;color:var(--ink);font-size:.92rem}

/* email arrival */
.mailcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:640px;margin:0 auto;font-size:.9rem}
.mailcard .meta{color:var(--ink-3);font-size:.8rem}
.mailcard .subj{font-weight:600;margin:4px 0 6px}
.greet{max-width:720px;margin:0 auto 14px}

/* resume / profile */
.profile{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:24px;align-items:start}
.back{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:10px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:28px 24px;box-shadow:0 8px 28px rgba(28,27,25,.07);position:relative}
.sheet .wm{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.1em;color:var(--brass);border:1px solid var(--brass);border-radius:4px;padding:2px 6px}
.redact{display:inline-block;background:var(--ink);border-radius:2px;height:.95em;vertical-align:-.1em}
.sheet h2{font-size:1.4rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet .sub{color:var(--ink-2);margin-top:4px}
.sheet h4{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;font-family:var(--sans);font-weight:600}
.role{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 0;border-top:1px solid #efe9de}
.role .when{font-size:.82rem;color:var(--ink-3)}
.role .where{font-weight:600;font-size:.93rem}
.role p{font-size:.9rem;color:var(--ink-2);margin-top:2px}
.hl{background:linear-gradient(transparent 55%,var(--brass-soft) 55%)}
.notes{background:var(--paper);border-radius:8px;padding:14px;font-size:.9rem}
.notes dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px}
.notes dt{color:var(--ink-3)}
.revealed .redact{display:none}
.name-reveal{color:var(--green)}
.fresh .name-reveal{animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{margin-bottom:6px}
.terms-mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.terms-mini div{background:var(--paper);border-radius:8px;padding:8px 10px}
.terms-mini b{display:block;font-family:var(--serif);font-size:1.15rem;font-weight:600}
.terms-mini span{font-size:.74rem;color:var(--ink-3)}
.ask textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px;font:inherit;font-size:.92rem;min-height:70px;resize:vertical;background:#fff}
.qa{font-size:.88rem;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.qa .q{align-self:flex-end;background:var(--green-soft);border-radius:10px 10px 2px 10px;padding:8px 10px;max-width:90%}
.qa .a{background:var(--paper);border-radius:10px 10px 10px 2px;padding:8px 10px;max-width:92%}
.qa .a b{display:block;font-size:.74rem;color:var(--ink-3);font-weight:600}

/* sheet modal */
.overlay{position:fixed;inset:0;background:rgba(28,27,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadebg .2s}
@keyframes fadebg{from{opacity:0}}
.modal{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:22px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:16px;padding:28px}}
.modal .x{float:right;background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px}
.modal ul.ticks{list-style:none;margin:12px 0;font-size:.92rem}
.modal ul.ticks li{padding:4px 0 4px 24px;position:relative}
.modal ul.ticks li::before{content:"\2713";position:absolute;left:0;color:var(--green);font-weight:700}
label.f{display:block;font-size:.84rem;font-weight:600;margin:12px 0 4px}
input.in{width:100%;border:1.5px solid var(--line-2);border-radius:9px;padding:11px 12px;font:inherit;background:#fff;min-height:46px}
input.in:focus{border-color:var(--green);outline:none}
.err{color:var(--red);font-size:.84rem;margin-top:4px}
.soft{color:var(--brass);font-size:.84rem;margin-top:4px}
.review{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:16px;font-size:.86rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.tiles div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tiles b{display:block;font-family:var(--serif);font-size:1.3rem;font-weight:600}
.tiles span{font-size:.78rem;color:var(--ink-3)}
.clauses{font-size:.88rem;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 32px;margin:10px 0}
.clauses li{margin:4px 0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin:14px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green);flex:none}
.sig{font-family:"Brush Script MT","Segoe Script",cursive;font-size:1.5rem;color:var(--green);min-height:36px;border-bottom:1.5px solid var(--ink);padding:2px 4px;margin-top:6px}
.alt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.alt-actions .btn{font-size:.88rem;padding:10px 8px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slot{border:1.5px solid var(--line-2);background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer;font-size:.88rem;min-height:44px}
.slot[aria-pressed=true]{border-color:var(--green);background:var(--green-soft);font-weight:600}
.done-box{background:var(--green-soft);border:1px solid #D9E3EF;border-radius:var(--r);padding:16px;margin-top:12px}
.done-box h3{color:var(--green)}
.timeline{list-style:none;margin-top:10px;font-size:.88rem}
.timeline li{padding:6px 0 6px 22px;position:relative;border-left:2px solid var(--line-2);margin-left:6px}
.timeline li::before{content:"";position:absolute;left:-7px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--green)}
.timeline li.ok::before{background:var(--green)}

/* mobile sticky CTA */
.mbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40;display:none}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px);animation:up .2s}

@media(max-width:820px){
  .profile{grid-template-columns:1fr}
  .side{position:static}
  .how{grid-template-columns:1fr 1fr}
  .mbar.show{display:block}
  body.has-mbar{padding-bottom:76px}
  .sheet{padding:22px 16px}
  .role{grid-template-columns:1fr;gap:2px}
  .notes dl{grid-template-columns:1fr}
  .notes dt{margin-top:6px}
}
@media(max-width:420px){.alt-actions{grid-template-columns:1fr}.sender .who{display:none}}
</style>
</head>
<body>

<div class="demobar" role="region" aria-label="Demo controls">
  <div class="wrap">
    <b>Demo</b>
    <span class="seg" role="group" aria-label="Where the employer comes from">
      <button type="button" data-entry="site" aria-pressed="true">Website visitor</button>
      <button type="button" data-entry="email" aria-pressed="false">From cold email</button>
    </span>
    <button type="button" class="restart" id="restart">Restart</button>
    <a class="restart" href="../index.html" style="text-decoration:none">← Back to prototype</a>
    <span class="note">Sample candidates, terms and firm. Not real people.</span>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#" id="home" aria-label="Orion Placement"><img src="../assets/images/orion-logo.png" alt="Orion Placement"></a>
    <div class="sender" id="sender">
      <span class="stars" aria-hidden="true">★★★★★</span><span><b>5.0</b> on Google</span>
    </div>
  </div>
  <div class="wrap"><ol class="steps" id="steps" aria-label="Progress"></ol><p class="stepcap" id="stepcap" aria-hidden="true"></p></div>
</header>

<main id="app" class="wrap"></main>

<div class="mbar" id="mbar"><button class="btn btn-primary btn-block" id="mbar-btn" type="button"></button></div>

<script>

  {id:"miami", label:"Miami, FL", re:/miami|fort lauderdale|boca/i},

];
var MODES = [{id:"any",label:"Either"},{id:"on-site",label:"On-site"},{id:"hybrid",label:"Hybrid"},{id:"remote",label:"Remote"}];

var STAMPS = function(c){ return ["Spoke with Jon " + c.spoke, "Bar standing checked " + c.spoke, "Agreed to be shown"]; };

var CANDS = [
  {id:"EP-TX-0412", role:"ep", city:"houston", area:"Houston, Inner Loop", years:5, bar:"Texas", pay:[125,140], avail:"4 weeks' notice", modes:["on-site","hybrid"], spoke:"12 Nov",
   headline:"Estate planning associate who runs trust administrations", firm:"Estate planning boutique, 6 attorneys",
   mix:[["Wills and trusts",55],["Trust administration",25],["Probate",20]],
   why:"Five years at firms your size; runs administrations without a partner in the room.",
   roles:[["2023–now","Estate planning boutique, 6 attorneys","Associate. Own client meetings, drafts revocable trusts and wills, <span class=hl>20+ trust administrations a year</span>. WealthCounsel, Clio."],
          ["2021–2023","General practice firm, 9 attorneys","Associate. Probate filings, guardianships, estate planning drafting."]],
   school:"Texas law school, J.D. 2021", leaving:"Wants a firm where she can build a practice; current firm has no path to partner.",
   office:"4 days in office is fine", name:"Jordan Ellis", initials:"JE"},
  {id:"EP-TX-0476", role:"ep", city:"houston", area:"Katy", years:4, bar:"Texas", pay:[118,130], avail:"3 weeks' notice", modes:["on-site","hybrid"], spoke:"10 Nov",
   headline:"Estate planning associate, high-volume drafting and client meetings", firm:"Family and estates firm, 10 attorneys",
   mix:[["Wills and trusts",65],["Probate",25],["Guardianship",10]],
   why:"Four years of client-facing drafting at a ten-attorney firm.",

/* ---------- parsing the box ---------- */
function parse(text){
  var seat = {role:null, city:null, years:"any", mode:"any", pay:null};
  var r, i;
  /* paralegal wins over practice words: "estate planning paralegal" is a paralegal */
  if (/paralegal|legal assistant/i.test(text)) seat.role = "para";
  else for (i=0;i<ROLES.length;i++) if (ROLES[i].re.test(text)) { seat.role = ROLES[i].id; break; }
  for (i=0;i<CITIES.length;i++) if (CITIES[i].re.test(text)) { seat.city = CITIES[i].id; break; }
  r = text.match(/(\d{1,2})\s*(?:-|–|to)\s*(\d{1,2})\s*\+?\s*(?:years|yrs|yr)/i);
  var lo = null;
  if (r) lo = (+r[1] + +r[2]) / 2;
  else { r = text.match(/(\d{1,2})\s*\+?\s*(?:years|yrs|yr)/i); if (r) lo = +r[1]; }
  if (lo !== null) seat.years = lo < 3 ? "1-3" : lo < 6 ? "3-6" : "6+";
  if (/hybrid/i.test(text)) seat.mode = "hybrid"; else if (/on-?site|in office|in-office/i.test(text)) seat.mode = "on-site"; else if (/remote/i.test(text)) seat.mode = "remote";
  r = text.match(/\$\s?(\d{2,3})(?:,\d{3}|k)?/i) || text.match(/(\d{2,3})\s?k\b/i);
  if (r) seat.pay = +r[1];
  return seat;
}

/* ---------- matching ---------- */
function matches(seat){
  var y = find(YEARS, seat.years);
  return CANDS.filter(function(c){
    if (seat.role && c.role !== seat.role) return false;
    if (seat.city && seat.city !== "any" && c.city !== seat.city && !(c.reloc||[]).includes(seat.city)) return false;
    return true;
  }).map(function(c){
    var notes = [], warn = false;
    if (y && y.lo !== undefined) { if (c.years >= y.lo && c.years <= y.hi) notes.push(c.years + " yrs, inside your range"); else { notes.push(c.years + " yrs, outside your range"); warn = true; } }
    if (seat.pay) { if (c.pay[0] <= seat.pay) notes.push("Asks " + money(c.pay[0]) + "+, within your " + money(seat.pay)); else { notes.push("Asks " + money(c.pay[0]) + "+, above your " + money(seat.pay)); warn = true; } }
    if (seat.mode !== "any" && seat.mode !== "remote" && !c.modes.includes(seat.mode)) { notes.push("Prefers " + c.modes.join(" or ")); warn = true; }
    return {c:c, notes:notes, warn:warn};
  }).sort(function(a,b){ return a.warn - b.warn; });
}

    '<p class="subj">Estate planning associate, 5 yrs, for your Houston seat</p>' +
    '<p class="muted">Hi Dana, I saw your associate posting. One of our candidates fits it closely: 5 years, Texas bar, runs trust administrations, open to Houston. Full profile here, no sign-up needed.</p>' +
    '<p style="margin-top:8px"><button class="btn btn-primary" id="open-link" type="button">View the candidate</button> <span class="small muted">(the link in the email)</span></p></div>' +
    '<p class="small muted" style="text-align:center;margin-top:14px">In the real email the link is personal, so the page already knows the firm and skips any form.</p>' +
    '</section>';
  $("#open-link").addEventListener("click", function(){ track("email_link_opened"); S.current = c.id; S.screen = "profile"; render(); window.scrollTo(0,0); });
}

/* ---------- profile ---------- */
function renderProfile(){
  var c = find(CANDS, S.current), unlocked = !!S.unlocked[c.id], signed = S.signed && S.signedFor === c.id;
  var L = S.lead || {};
  var greet = S.entry === "email" && !signed ? '<p class="greet small muted">For ' + esc(L.name) + ', ' + esc(L.firm) + '. Sent by Justin.</p>' : '';
  var back = S.entry === "site" ? '<button class="back" type="button" id="back">← All candidates</button>' : '';

  var nameHtml = signed ? '<span class="name-reveal">' + esc(c.name) + ' <span class="small muted">(sample)</span></span>' : '<span class="redact" style="width:9em" aria-label="Name hidden"></span>';
  var rolesHtml = c.roles.map(function(r){
    var where = signed ? '<span class="name-reveal">' + esc(r[1].replace(/,.*/,"")) + ' LLP (sample)</span>, ' + esc(r[1].split(", ")[1] || "") : '<span class="redact" style="width:6em" aria-label="Firm name hidden"></span> ' + esc(r[1]);
    return '<div class="role"><div class="when">' + r[0] + '</div><div><div class="where">' + where + '</div>' + (unlocked ? '<p>' + r[2] + '</p>' : '') + '</div></div>';
  }).join("");

  var sheet = '<div class="sheet' + (signed?" revealed":"") + (S.justSigned?" fresh":"") + '"><span class="wm">' + (signed ? "FULL PROFILE" : unlocked ? "REDACTED" : "PREVIEW") + '</span>' +
    '<span class="eyebrow">' + c.id + '</span>' +
    '<h2>' + nameHtml + '</h2>' +
    '<p class="sub">' + esc(c.headline) + '</p>' +
    '<div class="stamps" style="margin-top:12px">' + STAMPS(c).map(function(s){ return '<span class="stamp">' + esc(s) + '</span>'; }).join("") + '</div>' +
    '<h4>At a glance</h4><dl class="facts" style="font-size:.92rem"><div><dt>Experience</dt><dd>' + c.years + ' years</dd></div><div><dt>Bar</dt><dd>' + esc(c.bar) + ', active</dd></div>' +
    '<div><dt>Location</dt><dd>' + esc(c.area) + '</dd></div><div><dt>Office</dt><dd>' + esc(c.modes.join(" or ")) + '</dd></div>' +
    '<div><dt>Base asked</dt><dd>' + money(c.pay[0]) + '–' + money(c.pay[1]) + '</dd></div><div><dt>Available</dt><dd>' + esc(c.avail) + '</dd></div></dl>' +
    '<h4>Experience</h4>' + rolesHtml +
    (unlocked ? '<h4>Education</h4><p style="font-size:.9rem">' + (signed ? '<span class="name-reveal">' + esc(c.school.replace("Texas law school","University of Houston Law Center (sample)")) + '</span>' : esc(c.school)) + '</p>' +
      '<h4>Jon’s notes from the call</h4><div class="notes"><dl><dt>Why leaving</dt><dd>' + esc(c.leaving) + '</dd><dt>Office days</dt><dd>' + esc(c.office) + '</dd><dt>Pay</dt><dd>' + money(c.pay[0]) + '–' + money(c.pay[1]) + ' base; bonus negotiable</dd><dt>Notice</dt><dd>' + esc(c.avail) + '</dd></dl></div>'
      : '<div class="notes" style="margin-top:16px;text-align:center"><p style="font-weight:600">Every role in detail, education and Jon’s notes</p><p class="small muted">' + (S.entry==="email" ? "One tap, no form. Nothing to sign." : "Work email only. Nothing to sign.") + '</p><button class="btn btn-primary" style="margin-top:10px" id="unlock" type="button">Show me the full resume</button></div>') +
    '</div>';

  var side = '';
  if (signed) side = signedPanel(c);
  else {
    side = '<div class="panel"><h3>Want to meet ' + (unlocked ? "this candidate" : "them") + '?</h3>' +
      '<p class="small muted">Accept the one-page terms on this page. The name and an interview time follow straight away.</p>' +
      '<div class="terms-mini"><div><b>' + TERMS.fee + '</b><span>of first-year base, only if you hire</span></div><div><b>' + TERMS.guarantee + '</b><span>replacement guarantee</span></div>' +
      '<div><b>$0</b><span>to see profiles or interview</span></div><div><b>' + TERMS.excl + '</b><span>exclusivity. Keep other recruiters</span></div></div>' +
      '<button class="btn btn-primary btn-block" type="button" id="meet">Meet this candidate</button>' +
      '<p class="trust" style="text-align:center">Already know this candidate? Tell us and there is no fee.</p></div>';
    if (unlocked) side += askPanel(c);
    side += '<div class="panel small"><p><span class="avatar" style="display:inline-grid;vertical-align:middle;margin-right:6px">J</span><b>Justin</b> sends the introductions and agrees terms. <b>Jon</b> screened this candidate.</p><p class="muted" style="margin-top:6px">Emails only come from @orionplacement.com.</p></div>';
  }

  app.innerHTML = '<section class="screen">' + greet + back + '<div class="profile"><div>' + sheet + '</div><aside class="side">' + side + '</aside></div>' + (S.entry==="site" && !signed ? similarHtml(c) : '') + '</section>';

  if ($("#back")) $("#back").addEventListener("click", function(){ S.screen = "results"; render(); window.scrollTo(0,0); });
  if ($("#unlock")) $("#unlock").addEventListener("click", function(){
    if (S.entry === "email") { S.unlocked[c.id] = true; track("resume_unlocked",{id:c.id, via:"email_link_one_tap"}); render(); toast("Full resume unlocked. A copy is in your inbox."); }
    else openGate(c.id);
  });
  if ($("#meet")) $("#meet").addEventListener("click", function(){ openTerms(c.id); });
  bindAsk(c); bindSigned(c); bindCards(); S.justSigned = false;
  if (!signed) mbar(unlocked ? "Meet this candidate" : "Show me the full resume", function(){ unlocked ? openTerms(c.id) : $("#unlock").click(); });
}

function similarHtml(c){
  var sim = matches(S.seat).filter(function(r){ return r.c.id !== c.id; }).slice(0,2);
  if (!sim.length) return '';
  return '<h3 style="margin:28px 0 12px">Others for this seat</h3><div class="cards">' + sim.map(cardHtml).join("") + '</div>';
}

/* ---------- ask Jon ---------- */
var ANSWERS = [
  [/firm|where|who/i, "She is at a 6-attorney boutique now and was at a 9-attorney general practice before. I can name both firms once you are both happy to meet."],
  [/pay|salary|base|bonus|money|\$|\d+\s?k\b/i, "Her floor is $125k base. A bonus tied to originations would get her interested at $120k."],
  [/office|remote|hybrid|days/i, "Four days in the office is fine. She lives 20 minutes from downtown."],
  [/bar|licen|disciplin/i, "Texas bar since 2021, active, no public discipline. I checked on 12 Nov."],
  [/notice|start|when/i, "Four weeks' notice. She could start the first week of January."]
];
function askPanel(c){
  var list = S.qa[c.id] || [];
  return '<div class="panel ask"><h3>Ask Jon about this candidate</h3><p class="small muted">Anonymous to the candidate. Jon answers by email, usually within the hour.</p>' +
    '<div class="qa" id="qa">' + list.map(function(x){ return '<div class="q">' + esc(x.q) + '</div>' + (x.a ? '<div class="a"><b>Jon · sample answer</b>' + esc(x.a) + '</div>' : '<div class="a muted">Jon is typing…</div>'); }).join("") + '</div>' +
    '<form id="ask-form" style="margin-top:10px"><label class="hidden" for="ask-q">Your question</label><textarea id="ask-q" placeholder="e.g. Which firms has she worked at? Would she take $120k?"></textarea>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:8px" type="submit">Send to Jon</button></form></div>';
}
function bindAsk(c){
  var f = $("#ask-form"); if (!f) return;
  f.addEventListener("submit", function(e){
    e.preventDefault(); var q = $("#ask-q").value.trim(); if (!q) return;
    var list = S.qa[c.id] = S.qa[c.id] || []; var item = {q:q, a:null}; list.push(item);
    track("question_to_jon",{id:c.id}); renderProfile();
    setTimeout(function(){
      var a = "Good question. I will check with the candidate and reply by email within the hour.";
      for (var i=0;i<ANSWERS.length;i++) if (ANSWERS[i][0].test(q)) { a = ANSWERS[i][1]; break; }
      item.a = a; if (S.screen === "profile" && S.current === c.id && !S.sheet) renderProfile();
    }, 1400);
  });
}

/* ---------- terms sheet ---------- */
function openTerms(id, readOnly){
  var c = id ? find(CANDS,id) : null, L = S.lead || {};
  S.sheet = "terms"; renderSteps();
  track("terms_opened",{id:id});
  modal('<span class="eyebrow">One-page terms' + (c ? ' · ' + c.id : '') + '</span><h2 style="margin-top:4px">' + (c ? "Meet this candidate" : "What you agree to") + '</h2>' +
    '<p class="small muted" style="margin-top:4px">Plain words. Signing takes about a minute. The full agreement is emailed to you as a PDF.</p>' +
    '<div class="tiles"><div><b>' + TERMS.fee + '</b><span>of first-year base, only if you hire</span></div><div><b>' + TERMS.guarantee + '</b><span>free replacement if they leave</span></div>' +
    '<div><b>30 days</b><span>to pay, counted from the start date</span></div><div><b>' + TERMS.excl + '</b><span>exclusivity required</span></div></div>' +
    '<ol class="clauses"><li>You pay nothing to see profiles or to interview.</li><li>If you already have this candidate’s resume, tell us within 2 business days and there is no fee for them.</li>' +
    '<li>If you hire someone we introduced within 12 months, as an employee or contractor, the fee applies.</li><li>If the hire leaves or is let go within 90 days, we find a replacement at no charge.</li></ol>' +
    (readOnly ? '<button class="btn btn-ghost btn-block" type="button" id="t-close">Close</button>' :
    '<form id="sign"><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 10px">' +
      '<div><label class="f" for="t-name">Your name</label><input class="in" id="t-name" autocomplete="name" value="' + esc(L.name || "") + '" placeholder="' + esc(L.guessFirst ? L.guessFirst + " …" : "Full name") + '"></div>' +
      '<div><label class="f" for="t-title">Title</label><input class="in" id="t-title" autocomplete="organization-title" value="' + esc(L.title || "") + '" placeholder="Partner"></div></div>' +
      '<label class="f" for="t-firm">Firm</label><input class="in" id="t-firm" autocomplete="organization" value="' + esc(L.firm || "") + '" placeholder="Firm name">' +
      '<p class="small muted" style="margin-top:12px">Signature</p><div class="sig" id="t-sig" aria-live="polite">' + esc(L.name || "") + '</div>' +
      '<label class="check"><input type="checkbox" id="t-ok"><span>I can sign for the firm and agree to these terms.</span></label>' +
      '<p class="err" id="t-err" role="alert"></p>' +
      '<button class="btn btn-primary btn-block" type="submit">Sign and see the name</button>' +
      '<div class="alt-actions"><button class="btn btn-ghost" type="button" id="t-partner">Send to my partner to sign</button><button class="btn btn-ghost" type="button" id="t-call">I’d like to talk about terms</button></div>' +
      '<div id="t-extra"></div></form>'));
  if (readOnly) { $("#t-close").addEventListener("click", closeModal); return; }
  var nm = $("#t-name");
  nm.addEventListener("input", function(){ $("#t-sig").textContent = nm.value; });
  $("#sign").addEventListener("submit", function(e){
    e.preventDefault();
    if (!nm.value.trim() || !$("#t-firm").value.trim()) { $("#t-err").textContent = "Add your name and firm to sign."; return; }
    if (!$("#t-ok").checked) { $("#t-err").textContent = "Tick the box to agree."; return; }
    S.lead = Object.assign({}, S.lead, {name:nm.value.trim(), title:$("#t-title").value.trim(), firm:$("#t-firm").value.trim()});
    S.signed = true; S.signedFor = c.id; S.unlocked[c.id] = true; S.justSigned = true;
    track("terms_signed",{id:c.id, path:"on_page"});
    closeModal(); render(); window.scrollTo(0,0);
  });
  $("#t-partner").addEventListener("click", function(){
    $("#t-extra").innerHTML = '<div class="panel" style="margin-top:12px"><label class="f" for="p-email" style="margin-top:0">Partner’s email</label><input class="in" id="p-email" type="email" placeholder="partner@yourfirm.com">' +
      '<label class="f" for="p-note">Note (optional)</label><input class="in" id="p-note" value="Strong fit for our estate planning seat. Can you sign so we can interview?">' +
      '<button class="btn btn-primary btn-block" style="margin-top:10px" type="button" id="p-send">Send sign link</button><p class="err" id="p-err" role="alert"></p></div>';
    $("#p-email").focus();
    $("#p-send").addEventListener("click", function(){
      var v = $("#p-email").value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { $("#p-err").textContent = "Enter your partner’s email."; return; }
      track("terms_sent_to_partner",{id:c.id});
      $("#t-extra").innerHTML = '<div class="done-box"><h3>Sent to ' + esc(v) + '</h3><p class="small">They get the profile and a one-minute sign link. We email you the moment they sign, and you can keep asking Jon questions meanwhile.</p></div>';
    });
  });
  $("#t-call").addEventListener("click", function(){
    $("#t-extra").innerHTML = '<div class="panel" style="margin-top:12px"><p style="font-weight:600">15 minutes with Justin about fee, guarantee or payment timing</p><div class="slots">' + slotButtons(3) + '</div></div>';
    bindSlots($("#t-extra"), function(label){ track("terms_call_booked",{slot:label}); $("#t-extra").innerHTML = '<div class="done-box"><h3>Booked: ' + esc(label) + ' CT</h3><p class="small">Justin will call you. The candidate stays reserved for your firm until then.</p></div>'; });
  });
}

/* ---------- after signing ---------- */
function slotDays(){
  var out = [], d = new Date(2026,10,18);
  while (out.length < 3) { d.setDate(d.getDate()+1); if (d.getDay() % 6) out.push(new Date(d)); }
  return out;
}
function slotButtons(n){
  var days = slotDays(), times = ["10:00","13:30","16:00"], out = [];
  days.forEach(function(d){ times.forEach(function(t){ out.push(d.toLocaleDateString("en-US",{weekday:"short", day:"numeric", month:"short"}) + ", " + t); }); });
  return out.slice(0, n || out.length).map(function(s){ return '<button type="button" class="slot" aria-pressed="false" data-slot="' + s + '">' + s + '</button>'; }).join("");
}
function bindSlots(root, done){
  root.querySelectorAll("[data-slot]").forEach(function(b){ b.addEventListener("click", function(){ done(b.dataset.slot); }); });
}
function signedPanel(c){
  var L = S.lead || {};
  if (S.slot) return '<div class="panel"><div class="done-box" style="margin-top:0"><h3>Interview requested</h3><p class="small">' + esc(S.slot) + ' CT with ' + esc(c.name) + '.</p></div>' +
    '<ol class="timeline"><li class="ok">Terms signed by ' + esc(L.name) + ' · PDF sent to your inbox</li><li class="ok">Interview time sent to the candidate</li><li>Justin confirms within the hour</li><li>Calendar invite with a video link</li></ol></div>';
  return '<div class="panel"><span class="eyebrow">Signed by ' + esc(L.name) + (L.firm ? ', ' + esc(L.firm) : '') + '</span><h3 style="margin-top:4px">Pick an interview time</h3>' +
    '<p class="small muted">Times the candidate already offered. Justin confirms within the hour.</p><div class="slots" id="slots">' + slotButtons() + '</div>' +
    '<p class="small" style="margin-top:12px"><a href="#" onclick="return false">LinkedIn profile</a> · <a href="#" onclick="return false">Download the resume (PDF)</a></p></div>' +
    '<div class="panel small"><p>Rather talk first? <a href="#" onclick="return false">Call Justin</a> or reply to any of our emails.</p></div>';
}
function bindSigned(c){
  var s = $("#slots"); if (!s) return;
  bindSlots(s, function(label){ S.slot = label; track("interview_requested",{id:c.id, slot:label}); renderProfile(); toast("Interview requested. Justin confirms within the hour."); });
  mbar(null);
}

/* ---------- modal ---------- */
var lastFocus = null;
function modal(inner){
  closeModal(true); lastFocus = document.activeElement;
  var o = document.createElement("div"); o.className = "overlay"; o.id = "overlay";
  o.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><button class="x" type="button" aria-label="Close">×</button>' + inner + '</div>';
  document.body.appendChild(o); document.body.style.overflow = "hidden";
  o.addEventListener("click", function(e){ if (e.target === o) closeModal(); });
  $(".x", o).addEventListener("click", function(){ closeModal(); });
}
function closeModal(silent){
  var o = $("#overlay"); if (!o) return;
  o.remove(); document.body.style.overflow = ""; S.sheet = null;
  if (!silent) { renderSteps(); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
}
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeModal(); });

/* ---------- demo controls ---------- */
function setEntry(entry){
  closeModal(true);
  document.querySelectorAll(".toast").forEach(function(t){ t.remove(); });
  S = fresh(entry);
  document.querySelectorAll("[data-entry]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.entry === entry)); });
  track("demo_entry", {entry:entry});
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("[data-entry]").forEach(function(b){ b.addEventListener("click", function(){ setEntry(b.dataset.entry); }); });
$("#restart").addEventListener("click", function(){ setEntry(S.entry); });
$("#home").addEventListener("click", function(e){ e.preventDefault(); setEntry(S.entry); });

var start = /entry=email/.test(location.search) ? "email" : "site";
setEntry(start);
})();
</script>
</body>
</html>
